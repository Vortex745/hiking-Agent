name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Only pull requests narrow the work; pushes, merge groups and manual
      # runs keep the full suite.
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend }}
      gateway: ${{ github.event_name != 'pull_request' || steps.filter.outputs.gateway }}
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend }}
    steps:
      - name: Filter pull request paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            gateway:
              - 'gateway/**'
              - '.github/workflows/deploy.yml'
            backend:
              - 'ai-service/**'
              - 'evals/**'
              - 'scripts/**'
              - 'third_party/uniharness/**'
              - '.github/workflows/deploy.yml'

  frontend:
    name: Frontend build and browser regression
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check and build frontend
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser session regression
        env:
          BASE_URL: http://127.0.0.1:4173
          SCREENSHOT_PATH: ${{ runner.temp }}/frontend-ci/session-switch.png
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-ci"
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/frontend-ci/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused "$BASE_URL" > /dev/null
          npm run test:browser 2>&1 | tee "$RUNNER_TEMP/frontend-ci/browser.log"
          SCREENSHOT_DIR="$RUNNER_TEMP/frontend-ci/plan" npm run test:browser:plan 2>&1 | tee "$RUNNER_TEMP/frontend-ci/plan.log"

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-results
          path: ${{ runner.temp }}/frontend-ci/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  gateway:
    name: Gateway vet, test and build
    needs: changes
    if: ${{ needs.changes.outputs.gateway == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Download gateway dependencies
        run: go mod download

      - name: Verify gateway dependencies
        run: go mod verify

      - name: Vet gateway
        run: go vet ./...

      - name: Test gateway
        run: go test ./...

      - name: Build gateway
        run: go build -trimpath -o "$RUNNER_TEMP/gateway" .

  backend:
    name: Backend and evaluation contracts (offline)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Default validation is fully offline: no external model calls and no
      # Jev/OPENAI credentials are needed. Cred-gated live contracts skip
      # with a recorded reason; opt in deliberately with KERNEL_LIVE_E2E=1
      # (backend live contracts) or HIKING_EVAL_LIVE=1 (online quality
      # evals, which stay not_evaluated otherwise).
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      LANGFUSE_ENABLED: "false"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      KERNEL_LIVE_E2E: "0"
      HIKING_EVAL_LIVE: "0"
      # Contract helpers construct ChatOpenAI(...) on non-calling paths
      # (factory wiring, identity probes). With openai>=2 that constructor
      # requires a non-empty key. This value is intentionally fake and is
      # deliberately NOT paired with OPENAI_BASE_URL, so every cred-gated
      # live test still records a skip (live opt-in flags are disabled).
      OPENAI_API_KEY: "ci-placeholder-not-a-credential"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-test.txt
            evals/deepeval/requirements.txt
            third_party/uniharness/libs/uniharness/pyproject.toml

      # The vendored UniHarness fork is restored from the tracked offline
      # bundle (no network protocol; git metadata validated against the
      # recorded pin/ancestor). `scripts/restore-uniharness-fork.py` is the
      # single source of truth for restore + validation.
      - name: Restore vendored UniHarness fork (offline bundle)
        run: python scripts/restore-uniharness-fork.py

      - name: Verify restored fork pin and ancestry (read-only)
        run: python scripts/restore-uniharness-fork.py --check

      - name: Install AI service, test and eval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai-service/requirements-test.txt -e third_party/uniharness/libs/uniharness -r evals/deepeval/requirements.txt

      - name: Check installed dependency consistency
        id: dependencies
        run: python -m pip check

      - name: Prepare test reports
        run: mkdir -p "$RUNNER_TEMP/backend-ci"

      # Full offline backend regression. Includes the kernel identity tests
      # (third_party/uniharness was restored with real git metadata above)
      # and the Ticket 07 failure-injection self-check
      # (test_regression_injection_contract.py): a known old defect injected
      # through safe sentinels must fail the key regressions. Syntax
      # compilation is NOT a substitute for these behavior tests.
      - name: Offline backend regression
        working-directory: ai-service
        # These modules share app-level state and expect serial order; keep
        # them in a separate process lane until their isolation is fixed.
        run: |
          set +e
          python -m pytest -q -rs -n auto --dist=loadfile \
            --ignore=test_artifact_versioned_generation.py \
            --ignore=test_plan_entry_contract.py \
            --ignore=test_route_report_export.py \
            --junitxml="$RUNNER_TEMP/backend-ci/backend.xml"
          bulk=$?
          python -m pytest -q -rs \
            test_artifact_versioned_generation.py \
            test_plan_entry_contract.py \
            test_route_report_export.py \
            --junitxml="$RUNNER_TEMP/backend-ci/backend-serial.xml"
          serial=$?
          [ "$bulk" -eq 0 ] && [ "$serial" -eq 0 ]

      # Stable offline evaluation entry: contract results are recorded as
      # passed/failed with semantic quality explicitly not_evaluated (no
      # external model or judge call happens in this job).
      - name: Evaluation contract (offline)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m pytest -q -rs evals/test_evaluation_contract.py --junitxml="$RUNNER_TEMP/backend-ci/evaluation.xml"

      - name: Upload backend and evaluation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/backend-ci/*.xml
          if-no-files-found: ignore
          retention-days: 7

  validate:
    # Keep the existing check name so branch protection can require one gate.
    name: Validate services
    if: ${{ always() }}
    needs: [changes, frontend, gateway, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      GATEWAY_RESULT: ${{ needs.gateway.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_NEEDED: ${{ needs.changes.outputs.frontend }}
      GATEWAY_NEEDED: ${{ needs.changes.outputs.gateway }}
      BACKEND_NEEDED: ${{ needs.changes.outputs.backend }}
    steps:
      - name: Require every applicable service check to pass
        run: |
          printf 'Frontend: %s (needed: %s)\nGateway: %s (needed: %s)\nBackend: %s (needed: %s)\n' \
            "$FRONTEND_RESULT" "$FRONTEND_NEEDED" \
            "$GATEWAY_RESULT" "$GATEWAY_NEEDED" \
            "$BACKEND_RESULT" "$BACKEND_NEEDED"
          test "$CHANGES_RESULT" = success
          require_result() {
            if [ "$1" = "true" ]; then
              test "$2" = success
            else
              test "$2" = skipped
            fi
          }
          require_result "$FRONTEND_NEEDED" "$FRONTEND_RESULT"
          require_result "$GATEWAY_NEEDED" "$GATEWAY_RESULT"
          require_result "$BACKEND_NEEDED" "$BACKEND_RESULT"
