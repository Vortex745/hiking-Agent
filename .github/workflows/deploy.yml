name: Validate Vercel App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate services
    runs-on: ubuntu-latest
    env:
      # Default validation is fully offline: no external model calls and no
      # Jev/OPENAI credentials are needed. Cred-gated live contracts skip
      # with a recorded reason; opt in deliberately with KERNEL_LIVE_E2E=1
      # (backend live contracts) or HIKING_EVAL_LIVE=1 (online quality
      # evals, which stay not_evaluated otherwise).
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # Contract helpers construct ChatOpenAI(...) on non-calling paths
      # (factory wiring, identity probes). With openai>=2 that constructor
      # requires a non-empty key. This value is intentionally fake and is
      # deliberately NOT paired with OPENAI_BASE_URL, so every cred-gated
      # live test still records a skip (KERNEL_LIVE_E2E / HIKING_EVAL_LIVE
      # remain unset; no external model call happens in this job).
      OPENAI_API_KEY: "ci-placeholder-not-a-credential"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Validate gateway
        working-directory: gateway
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The vendored UniHarness fork is restored from the tracked offline
      # bundle (no network protocol; git metadata validated against the
      # recorded pin/ancestor). `scripts/restore-uniharness-fork.py` is the
      # single source of truth for restore + validation.
      - name: Restore vendored UniHarness fork (offline bundle)
        run: python scripts/restore-uniharness-fork.py

      - name: Verify restored fork pin and ancestry (read-only)
        run: python scripts/restore-uniharness-fork.py --check

      - name: Install AI service, test and eval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai-service/requirements.txt -r ai-service/requirements-test.txt
          python -m pip install -e third_party/uniharness/libs/uniharness
          python -m pip install -r evals/deepeval/requirements.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      # Full offline backend regression. Includes the kernel identity tests
      # (third_party/uniharness was restored with real git metadata above)
      # and the Ticket 07 failure-injection self-check
      # (test_regression_injection_contract.py): a known old defect injected
      # through safe sentinels must fail the key regressions. Syntax
      # compilation is NOT a substitute for these behavior tests.
      - name: Offline backend regression
        working-directory: ai-service
        run: python -m pytest -q -rs

      # Stable offline evaluation entry: contract results are recorded as
      # passed/failed with semantic quality explicitly not_evaluated (no
      # external model or judge call happens in this job).
      - name: Evaluation contract (offline)
        run: python -m pytest -q evals/test_evaluation_contract.py
