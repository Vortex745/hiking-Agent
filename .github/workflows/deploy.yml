name: Validate Vercel App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Validate gateway
        working-directory: gateway
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AI service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ai-service/requirements.txt pytest
          python -m pip install -e third_party/uniharness/libs/uniharness

      - name: Validate AI service
        working-directory: ai-service
        env:
          AGENT_V2_ENABLED: "false"
        run: |
          python -m pytest -q
          python -m compileall -q .

      - name: Validate production Compose
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build AI service image with vendored UniHarness
        run: docker build --file ai-service/Dockerfile --tag ai-service-ci .

      - name: Build gateway image
        run: docker build --file gateway/Dockerfile --tag gateway-ci gateway

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag frontend-ci frontend
